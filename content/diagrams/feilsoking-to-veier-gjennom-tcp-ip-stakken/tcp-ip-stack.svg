<svg xmlns="http://www.w3.org/2000/svg" width="640" height="418" viewBox="0 0 640 418">
  <!-- The TCP/IP stack and where each way starts ("Which way?"). The
       Norwegian twin is tcp-ip-stakken.svg: change both, then npm run diagrams. -->
  <rect x="1" y="1" width="638" height="416" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Column headers, bottom-aligned on the second line -->
  <text x="310" y="72" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Bottom-up</text>
  <text x="435" y="72" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Top-down</text>
  <text x="560" y="46" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">Start in</text>
  <text x="560" y="72" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">the middle</text>

  <!-- The layers, 5 at the top: bands 52 high, 10 apart -->
  <g fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5">
    <rect x="24" y="92" width="592" height="52" rx="10"/>
    <rect x="24" y="154" width="592" height="52" rx="10"/>
    <rect x="24" y="216" width="592" height="52" rx="10"/>
    <rect x="24" y="278" width="592" height="52" rx="10"/>
    <rect x="24" y="340" width="592" height="52" rx="10"/>
  </g>
  <text x="46" y="125" font-size="22" font-weight="700" fill="#4b5563">5</text>
  <text x="76" y="125" font-size="22" fill="#111827">Application</text>
  <text x="46" y="187" font-size="22" font-weight="700" fill="#4b5563">4</text>
  <text x="76" y="187" font-size="22" fill="#111827">Transport</text>
  <text x="46" y="249" font-size="22" font-weight="700" fill="#4b5563">3</text>
  <text x="76" y="249" font-size="22" fill="#111827">Internet (IP)</text>
  <text x="46" y="311" font-size="22" font-weight="700" fill="#4b5563">2</text>
  <text x="76" y="311" font-size="22" fill="#111827">Link</text>
  <text x="46" y="373" font-size="22" font-weight="700" fill="#4b5563">1</text>
  <text x="76" y="373" font-size="22" fill="#111827">Physical</text>

  <!-- The ways: a dot where you start, an arrow where you go -->
  <g stroke="#dc2626" stroke-width="3">
    <line x1="310" y1="366" x2="310" y2="108"/>
    <line x1="435" y1="118" x2="435" y2="376"/>
    <line x1="560" y1="242" x2="560" y2="108"/>
    <line x1="560" y1="242" x2="560" y2="376"/>
  </g>
  <g fill="#dc2626">
    <path d="M310 98l8 16h-16z"/>
    <circle cx="310" cy="366" r="8"/>
    <path d="M435 386l8-16h-16z"/>
    <circle cx="435" cy="118" r="8"/>
    <path d="M560 98l8 16h-16z"/>
    <path d="M560 386l8-16h-16z"/>
    <circle cx="560" cy="242" r="8"/>
  </g>
</svg>
