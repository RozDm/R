<svg xmlns="http://www.w3.org/2000/svg" width="640" height="536" viewBox="0 0 640 536">
  <!-- The chain of oversight: the watched (assumed taken over), a one-way
       boundary to a separate collector, a pulse to two outside receivers, an
       alarm to a person, and the keys over all of it. The Norwegian twin is
       tilsynskjeden.svg: change both, then npm run diagrams. -->
  <rect x="1" y="1" width="638" height="534" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- The watched: the part we assume an intruder can take over -->
  <rect x="24" y="24" width="592" height="72" rx="10" fill="#f3f4f6" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="46" y="56" font-size="22" fill="#111827">Servers, cloud, identity</text>
  <text x="46" y="80" font-size="20" fill="#dc2626">assume it can be taken over</text>
  <text x="594" y="56" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">1 The record</text>

  <!-- Layers 2 and 3, and the person the alarm must reach -->
  <g fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5">
    <rect x="24" y="140" width="592" height="72" rx="10"/>
    <rect x="24" y="256" width="592" height="72" rx="10"/>
    <rect x="24" y="372" width="592" height="48" rx="10"/>
  </g>
  <text x="46" y="172" font-size="22" fill="#111827">Separate collector</text>
  <text x="46" y="196" font-size="20" fill="#4b5563">alerts on tampering, silence, odd behaviour</text>
  <text x="594" y="172" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">2 The observer</text>
  <text x="46" y="288" font-size="22" fill="#111827">Two outside receivers</text>
  <text x="46" y="312" font-size="20" fill="#4b5563">at different providers</text>
  <text x="594" y="288" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">3 The alarm</text>
  <text x="46" y="403" font-size="22" fill="#111827">A person</text>

  <!-- One way down: what crosses the gap cannot be reached back -->
  <g stroke="#4b5563" stroke-width="3">
    <line x1="76" y1="96" x2="76" y2="126"/>
    <line x1="76" y1="212" x2="76" y2="242"/>
    <line x1="76" y1="328" x2="76" y2="358"/>
  </g>
  <g fill="#4b5563">
    <path d="M76 140l8-16h-16z"/>
    <path d="M76 256l8-16h-16z"/>
    <path d="M76 372l8-16h-16z"/>
  </g>
  <text x="100" y="124" font-size="20" fill="#111827">records and beats, one way</text>
  <text x="594" y="124" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">no way back</text>
  <text x="100" y="240" font-size="20" fill="#111827">a steady pulse</text>
  <text x="100" y="356" font-size="20" fill="#111827">alarm, on its own channel</text>

  <!-- The keys decide who may change the rest -->
  <rect x="24" y="440" width="592" height="72" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="46" y="472" font-size="22" font-weight="700" fill="#111827">4 The keys: who may change layers 1–3</text>
  <text x="46" y="496" font-size="18" fill="#4b5563">borrowed time, two pairs of eyes, noisy spare key</text>
</svg>
