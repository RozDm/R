<svg xmlns="http://www.w3.org/2000/svg" width="640" height="536" viewBox="0 0 640 536">
  <!-- Tilsynskjeden: de voktede (antatt overtatt), en enveisgrense til en egen
       samler, en puls til to eksterne mottakere, en alarm til et menneske, og
       nøklene over det hele. Den engelske tvillingen er oversight-chain.svg:
       endre begge, kjør så npm run diagrams. -->
  <rect x="1" y="1" width="638" height="534" rx="14" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- De voktede: delen vi antar at en inntrenger kan overta -->
  <rect x="24" y="24" width="592" height="72" rx="10" fill="#f3f4f6" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="46" y="56" font-size="22" fill="#111827">Servere, sky, identitet</text>
  <text x="46" y="80" font-size="20" fill="#dc2626">anta at den kan bli overtatt</text>
  <text x="594" y="56" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">1 Sporet</text>

  <!-- Lag 2 og 3, og mennesket alarmen må nå -->
  <g fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1.5">
    <rect x="24" y="140" width="592" height="72" rx="10"/>
    <rect x="24" y="256" width="592" height="72" rx="10"/>
    <rect x="24" y="372" width="592" height="48" rx="10"/>
  </g>
  <text x="46" y="172" font-size="22" fill="#111827">Egen samler</text>
  <text x="46" y="196" font-size="20" fill="#4b5563">varsler om tukling, stillhet og avvik</text>
  <text x="594" y="172" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">2 Observatøren</text>
  <text x="46" y="288" font-size="22" fill="#111827">To eksterne mottakere</text>
  <text x="46" y="312" font-size="20" fill="#4b5563">hos ulike leverandører</text>
  <text x="594" y="288" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">3 Alarmen</text>
  <text x="46" y="403" font-size="22" fill="#111827">Et menneske</text>

  <!-- Én vei nedover: det som har krysset gapet, kan ikke nås tilbake -->
  <g stroke="#4b5563" stroke-width="3">
    <line x1="76" y1="96" x2="76" y2="126"/>
    <line x1="76" y1="212" x2="76" y2="242"/>
    <line x1="76" y1="328" x2="76" y2="358"/>
  </g>
  <g fill="#4b5563">
    <path d="M76 140l8-16h-16z"/>
    <path d="M76 256l8-16h-16z"/>
    <path d="M76 372l8-16h-16z"/>
  </g>
  <text x="100" y="124" font-size="20" fill="#111827">spor og slag, én vei</text>
  <text x="594" y="124" font-size="20" font-weight="700" text-anchor="end" fill="#4b5563">ingen vei tilbake</text>
  <text x="100" y="240" font-size="20" fill="#111827">en jevn puls</text>
  <text x="100" y="356" font-size="20" fill="#111827">alarm, på egen kanal</text>

  <!-- Nøklene avgjør hvem som får endre resten -->
  <rect x="24" y="440" width="592" height="72" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="46" y="472" font-size="22" font-weight="700" fill="#111827">4 Nøklene: hvem som kan endre lag 1–3</text>
  <text x="46" y="496" font-size="18" fill="#4b5563">lånt tid, to par øyne, en bråkete reservenøkkel</text>
</svg>
