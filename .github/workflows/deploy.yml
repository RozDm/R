name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret, not from GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Same gate as predeploy: never ship a red build.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          # Public Turnstile site key inlined into the bundle at build time;
          # empty string keeps the widget off, matching the worker gate.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: npm run build

      # Push runtime secrets before deploy so the new code sees them on the
      # next request. One `secret bulk` call = one new Worker version (three
      # `secret put`s made three). Secrets whose GH secret isn't configured are
      # left out, never blanked. The JSON goes over stdin, never to disk.
      - name: Sync runtime secrets
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AE_API_TOKEN: ${{ secrets.AE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          payload=$(node -e '
            const out = {}
            for (const k of ["TURNSTILE_SECRET", "CF_ACCOUNT_ID", "AE_API_TOKEN"]) {
              if (process.env[k]) out[k] = process.env[k]
              else console.error(`${k} not set — skipping`)
            }
            process.stdout.write(JSON.stringify(out))
          ')
          if [ "$payload" = "{}" ]; then
            echo "No runtime secrets configured — nothing to sync"
          else
            printf '%s' "$payload" | npx wrangler secret bulk
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test (live site)
        run: bash scripts/smoke.sh
