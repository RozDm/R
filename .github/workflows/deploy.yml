name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret, not from GitHub.
permissions:
  contents: read

jobs:
  # Everything that runs third-party package code (lint, tests, the Next
  # build) runs here, without secrets: a compromised dependency finds no
  # token to read. Its one input is the public Turnstile site key.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # No install scripts: esbuild's and workerd's binaries come from
      # optionalDependencies; nothing here needs a postinstall.
      - run: npm ci --ignore-scripts

      # Same gate as predeploy: never ship a red build.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          # Public site key, a repository variable (not a secret), inlined
          # into the bundle. The Worker answers every contact POST without a
          # token with 403 while TURNSTILE_SECRET is set, so an empty key
          # would break the form: fail instead.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          [ -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ] \
            || { echo "::error::repository variable TURNSTILE_SITE_KEY is not set"; exit 1; }
          npm run build
      # Needs out/: the WAF expression must block no URL the build serves.
      - run: npm run check:waf

      # The UI dictionary stays in one shared chunk (same check as ci.yml).
      - run: npm run check:dict

      # Every page's baked-in CSP covers each of its inline scripts.
      - run: npm run check:csp

      # out/ has a dot-directory (.well-known/security.txt), which
      # upload-artifact skips unless told otherwise.
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The only job with secrets: wrangler and the smoke test, nothing else.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Secrets live in the `production` environment (deployable from main
    # only); without this line the job gets none.
    environment: production
    steps:
      - uses: actions/checkout@v7

      # No npm cache here: the build job, which runs untrusted package code,
      # could have written it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out/

      # Push runtime secrets before deploy so the new code sees them on the
      # next request. One `secret bulk` call = one new Worker version (three
      # `secret put`s made three). Secrets whose GH secret isn't configured are
      # left out, never blanked. The JSON goes over stdin, never to disk.
      - name: Sync runtime secrets
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AE_API_TOKEN: ${{ secrets.AE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          payload=$(node -e '
            const out = {}
            for (const k of ["TURNSTILE_SECRET", "CF_ACCOUNT_ID", "AE_API_TOKEN", "NETBOX_URL"]) {
              if (process.env[k]) out[k] = process.env[k]
              else console.error(`${k} not set — skipping`)
            }
            process.stdout.write(JSON.stringify(out))
          ')
          if [ "$payload" = "{}" ]; then
            echo "No runtime secrets configured — nothing to sync"
          else
            printf '%s' "$payload" | npx wrangler secret bulk
          fi

      # The repo's own pinned wrangler (package-lock), not cloudflare/
      # wrangler-action: the action runs on the deprecated Node 20 runtime and
      # adds nothing over the CLI that `npm ci` already installed — same
      # version locally, in the secrets step above, and here.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test (live site)
        run: bash scripts/smoke.sh
