name: Zone rules

# Manual: applies the zone-level Cloudflare settings the site relies on
# outside the Worker, then checks prod.
#
# 1. A Response Header Transform Rule that sets `Cache-Control: no-store` on
#    every 4xx/5xx response. Static files are served asset-first
#    (run_worker_first negatives in wrangler.jsonc) with their headers from
#    public/_headers, which matches on path only — a MISS there (a chunk
#    requested from an edge still on the previous version during a deploy)
#    comes back 404 with the year-long `immutable`, and the browser keeps
#    that 404. Status-matching needs a zone rule. `ge 400`, never `ne 200`: a
#    304's headers update the stored 200, so matching 304s would turn every
#    cached chunk and the font into no-store. Found by its ref and updated in
#    place; other rules in the phase are left alone, a new one goes last.
# 2. JavaScript Detections off (`enable_js: false`). The edge injects its
#    loader into HTML after the Worker hashed the page's scripts, so the CSP
#    refuses it on every page view (one CSP report — a Worker request — each)
#    and the HTML loses its ETag. It outlived Bot Fight Mode being switched
#    off (docs/cloudflare-security.md, lesson 3).
#
# The token needs Zone → Zone: Read, Zone → Transform Rules: Edit and
# Zone → Bot Management: Edit.
on:
  workflow_dispatch:

concurrency:
  group: zone-rules
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret.
permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ZONE: rozsoshnykh.no
      PHASE: http_response_headers_transform
      REF: error_no_store
    steps:
      - name: Apply the 4xx/5xx no-store rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          fail() { echo "::error::$1"; jq -c '.errors' "$OUT" 2>/dev/null || cat "$OUT"; exit 1; }

          # Which token this is — its id, never its value — so a 403 can be
          # traced to the right one in the dashboard (its edit URL ends in the id).
          if [ "$(call GET /user/tokens/verify)" = 200 ]; then
            echo "Token: user-owned (My Profile → API Tokens), id $(jq -r '.result.id' "$OUT")"
          elif [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ "$(call GET "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")" = 200 ]; then
            echo "Token: account-owned (Manage Account → Account API Tokens), id $(jq -r '.result.id' "$OUT")"
          else
            echo "Token: could not identify (verify endpoints refused it)"
          fi

          [ "$(call GET "/zones?name=$ZONE")" = 200 ] || fail "zone lookup failed — the token needs Zone: Read"
          ZONE_ID=$(jq -r '.result[0].id // empty' "$OUT")
          [ -n "$ZONE_ID" ] || fail "zone $ZONE is not visible to this token"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"

          RULE=$(jq -nc --arg ref "$REF" '{
            ref: $ref,
            description: "4xx/5xx: Cache-Control no-store (.github/workflows/zone-rules.yml)",
            expression: "http.response.code ge 400",
            action: "rewrite",
            action_parameters: { headers: { "Cache-Control": { operation: "set", value: "no-store" } } },
            enabled: true
          }')

          code=$(call GET "/zones/$ZONE_ID/rulesets/phases/$PHASE/entrypoint") || true
          if [ "$code" = 404 ]; then
            [ "$(call PUT "/zones/$ZONE_ID/rulesets/phases/$PHASE/entrypoint" "$(jq -nc --argjson r "$RULE" '{rules: [$r]}')")" = 200 ] \
              || fail "creating the $PHASE ruleset failed — the token needs Transform Rules: Edit"
            echo "Created the $PHASE ruleset with the rule."
          elif [ "$code" = 200 ]; then
            RULESET_ID=$(jq -r '.result.id' "$OUT")
            RULE_ID=$(jq -r --arg ref "$REF" '[.result.rules // [] | .[] | select(.ref == $ref)][0].id // empty' "$OUT")
            if [ -n "$RULE_ID" ]; then
              [ "$(call PATCH "/zones/$ZONE_ID/rulesets/$RULESET_ID/rules/$RULE_ID" "$RULE")" = 200 ] \
                || fail "updating the rule failed — the token needs Transform Rules: Edit"
              echo "Updated rule $RULE_ID."
            else
              [ "$(call POST "/zones/$ZONE_ID/rulesets/$RULESET_ID/rules" "$RULE")" = 200 ] \
                || fail "adding the rule failed — the token needs Transform Rules: Edit"
              echo "Added the rule, last in the phase."
            fi
          else
            fail "reading the $PHASE ruleset failed (HTTP $code) — the token needs Transform Rules: Edit"
          fi
          echo "Rules in $PHASE now:"
          jq -c '.result.rules[] | {ref, enabled, expression, description}' "$OUT"

      - name: Turn off JavaScript Detections
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          fail() { echo "::error::$1"; jq -c '.errors' "$OUT" 2>/dev/null || cat "$OUT"; exit 1; }
          BM="/zones/$ZONE_ID/bot_management"

          [ "$(call GET "$BM")" = 200 ] || fail "reading $BM failed — the token needs Zone → Bot Management: Edit"
          BEFORE=$(jq -c '.result' "$OUT")
          echo "Before: $BEFORE"
          if [ "$(jq -r '.enable_js' <<<"$BEFORE")" = false ]; then
            echo "enable_js is already false."
            exit 0
          fi
          [ "$(call PUT "$BM" '{"enable_js":false}')" = 200 ] \
            || fail "setting enable_js failed — the token needs Zone → Bot Management: Edit"
          [ "$(call GET "$BM")" = 200 ] || fail "re-reading $BM failed"
          AFTER=$(jq -c '.result' "$OUT")
          echo "After:  $AFTER"
          [ "$(jq -r '.enable_js' <<<"$AFTER")" = false ] || fail "the PUT answered 200 but enable_js is not false"
          # The body names one field; anything else that moved is a surprise
          # to restore from the Before line.
          CHANGED=$(jq -nc --argjson a "$BEFORE" --argjson b "$AFTER" \
            '[$a, $b | keys[]] | unique | map(select(. != "enable_js" and $a[.] != $b[.]))')
          if [ "$CHANGED" != "[]" ]; then
            echo "::error::the PUT also changed $CHANGED — restore them from the Before line"
            exit 1
          fi
          echo "enable_js is now false; nothing else changed."

      - name: Check prod
        run: |
          set -u
          BASE="https://$ZONE"
          # A miss under an asset-first path: 404 + no-store (fresh URL per run,
          # retried while the rule propagates).
          MISS="$BASE/_next/static/chunks/zone-rules-probe-$GITHUB_RUN_ID.js"
          ok=
          for i in 1 2 3 4 5 6; do
            h=$(curl -sS -o /dev/null -D - --max-time 20 "$MISS" | tr -d '\r')
            if echo "$h" | grep -q '^HTTP/[0-9.]* 404' && echo "$h" | grep -qi '^cache-control: no-store$'; then ok=1; break; fi
            echo "  retry $i: $(echo "$h" | grep -i '^cache-control:' || echo 'no cache-control')"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$MISS is not 404 + no-store — the rule does not reach asset-server responses"; exit 1; }
          echo "OK   static miss: 404 + no-store"
          # A real chunk and its 304 keep the year-long immutable cache.
          C=$(curl -sS --max-time 20 "$BASE/" | grep -o '/_next/static/chunks/[^"]*\.js' | head -1)
          h=$(curl -sS -o /dev/null -D - --max-time 20 "$BASE$C" | tr -d '\r')
          echo "$h" | grep -qi '^cache-control: public, max-age=31536000, immutable$' \
            || { echo "::error::$C lost its immutable cache-control"; echo "$h"; exit 1; }
          etag=$(echo "$h" | grep -i '^etag:' | cut -d' ' -f2-)
          [ -n "$etag" ] || { echo "::error::$C has no etag — can't probe its 304"; echo "$h"; exit 1; }
          h=$(curl -sS -o /dev/null -D - --max-time 20 -H "If-None-Match: $etag" "$BASE$C" | tr -d '\r')
          echo "$h" | grep -q '^HTTP/[0-9.]* 304' \
            || { echo "::error::$C did not answer 304 to If-None-Match"; echo "$h"; exit 1; }
          if echo "$h" | grep -qi '^cache-control:.*no-store'; then
            echo "::error::the 304 for $C carries no-store"; echo "$h"; exit 1
          fi
          echo "OK   real chunk: immutable, 304 without no-store"
          # No edge-injected JavaScript Detections loader in the HTML (retried
          # while the setting propagates).
          ok=
          for i in $(seq 1 12); do
            h=$(curl -sS -o page.html -D - --max-time 20 "$BASE/" | tr -d '\r')
            if ! grep -q '/cdn-cgi/challenge-platform/' page.html; then ok=1; break; fi
            echo "  retry $i: the JSD loader is still injected"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$BASE/ still carries the /cdn-cgi/challenge-platform/ loader"; exit 1; }
          echo "OK   no JSD loader in $BASE/ ($(echo "$h" | grep -i '^etag:' || echo 'no etag'))"
