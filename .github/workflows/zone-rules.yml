name: Zone rules

# Manual: applies the zone-level Cloudflare settings the site relies on
# outside the Worker, then checks prod.
#
# 1. A Response Header Transform Rule that sets `Cache-Control: no-store` on
#    every 4xx/5xx response. Static files are served asset-first
#    (run_worker_first negatives in wrangler.jsonc) with their headers from
#    public/_headers, which matches on path only — a MISS there (a chunk
#    requested from an edge still on the previous version during a deploy)
#    comes back 404 with the year-long `immutable`, and the browser keeps
#    that 404. Status-matching needs a zone rule. `ge 400`, never `ne 200`: a
#    304's headers update the stored 200, so matching 304s would turn every
#    cached chunk and the font into no-store. Found by its ref and updated in
#    place; other rules in the phase are left alone, a new one goes last.
# 2. JavaScript Detections off (`enable_js: false`). The edge injects its
#    loader into HTML after the Worker hashed the page's scripts, so the CSP
#    refuses it on every page view (one CSP report — a Worker request — each)
#    and the HTML loses its ETag. It outlived Bot Fight Mode being switched
#    off (docs/cloudflare-security.md, lesson 3). The same step fails on bot
#    settings that would block search engines or CI (Bot Fight Mode, AI
#    training "block", AI Labyrinth…) — those stay dashboard-owned.
# 3. Zone settings: Browser Cache TTL "Respect Existing Headers" (0), 0-RTT
#    on, minimum TLS raised to 1.2 if below it (a stricter 1.3 is kept).
# 4. The "Block scanners" WAF custom rule from .github/waf/scanner-block.expr
#    (slug-safe: blog paths are exempt from its word patterns;
#    scripts/check-waf.mjs proves in CI that it blocks no built URL). The
#    dashboard-made rule is updated in place (found by ref, else by name),
#    validated with ?dry_run=true first; other custom rules are never touched.
#
# The token needs Zone → Zone: Read, Zone → Transform Rules: Edit,
# Zone → Bot Management: Edit, Zone → Zone Settings: Edit and
# Zone → Zone WAF: Edit.
on:
  workflow_dispatch:

concurrency:
  group: zone-rules
  cancel-in-progress: false

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret.
permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      CF_API: https://api.cloudflare.com/client/v4
      ZONE: rozsoshnykh.no
      PHASE: http_response_headers_transform
      REF: error_no_store
    steps:
      # Only for the WAF expression file (.github/waf/scanner-block.expr).
      - uses: actions/checkout@v7

      - name: Apply the 4xx/5xx no-store rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          fail() { echo "::error::$1"; jq -c '.errors' "$OUT" 2>/dev/null || cat "$OUT"; exit 1; }

          # Which token this is — its id, never its value — so a 403 can be
          # traced to the right one in the dashboard (its edit URL ends in the id).
          if [ "$(call GET /user/tokens/verify)" = 200 ]; then
            echo "Token: user-owned (My Profile → API Tokens), id $(jq -r '.result.id' "$OUT")"
          elif [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ "$(call GET "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")" = 200 ]; then
            echo "Token: account-owned (Manage Account → Account API Tokens), id $(jq -r '.result.id' "$OUT")"
          else
            echo "Token: could not identify (verify endpoints refused it)"
          fi

          [ "$(call GET "/zones?name=$ZONE")" = 200 ] || fail "zone lookup failed — the token needs Zone: Read"
          ZONE_ID=$(jq -r '.result[0].id // empty' "$OUT")
          [ -n "$ZONE_ID" ] || fail "zone $ZONE is not visible to this token"
          echo "ZONE_ID=$ZONE_ID" >> "$GITHUB_ENV"

          RULE=$(jq -nc --arg ref "$REF" '{
            ref: $ref,
            description: "4xx/5xx: Cache-Control no-store (.github/workflows/zone-rules.yml)",
            expression: "http.response.code ge 400",
            action: "rewrite",
            action_parameters: { headers: { "Cache-Control": { operation: "set", value: "no-store" } } },
            enabled: true
          }')

          code=$(call GET "/zones/$ZONE_ID/rulesets/phases/$PHASE/entrypoint") || true
          if [ "$code" = 404 ]; then
            [ "$(call PUT "/zones/$ZONE_ID/rulesets/phases/$PHASE/entrypoint" "$(jq -nc --argjson r "$RULE" '{rules: [$r]}')")" = 200 ] \
              || fail "creating the $PHASE ruleset failed — the token needs Transform Rules: Edit"
            echo "Created the $PHASE ruleset with the rule."
          elif [ "$code" = 200 ]; then
            RULESET_ID=$(jq -r '.result.id' "$OUT")
            RULE_ID=$(jq -r --arg ref "$REF" '[.result.rules // [] | .[] | select(.ref == $ref)][0].id // empty' "$OUT")
            if [ -n "$RULE_ID" ]; then
              [ "$(call PATCH "/zones/$ZONE_ID/rulesets/$RULESET_ID/rules/$RULE_ID" "$RULE")" = 200 ] \
                || fail "updating the rule failed — the token needs Transform Rules: Edit"
              echo "Updated rule $RULE_ID."
            else
              [ "$(call POST "/zones/$ZONE_ID/rulesets/$RULESET_ID/rules" "$RULE")" = 200 ] \
                || fail "adding the rule failed — the token needs Transform Rules: Edit"
              echo "Added the rule, last in the phase."
            fi
          else
            fail "reading the $PHASE ruleset failed (HTTP $code) — the token needs Transform Rules: Edit"
          fi
          echo "Rules in $PHASE now:"
          jq -c '.result.rules[] | {ref, enabled, expression, description}' "$OUT"

      - name: Bot settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          fail() { echo "::error::$1"; jq -c '.errors' "$OUT" 2>/dev/null || cat "$OUT"; exit 1; }
          BM="/zones/$ZONE_ID/bot_management"

          [ "$(call GET "$BM")" = 200 ] || fail "reading $BM failed — the token needs Zone → Bot Management: Edit"
          BEFORE=$(jq -c '.result' "$OUT")
          echo "Before: $BEFORE"
          # Owned here: JavaScript Detections off, and AI training crawlers
          # "disallow" — blocked at the edge while search crawlers pass (Check
          # prod probes GPTBot); "block" would also stop Googlebot, Bingbot and
          # Applebot. The deprecated "Block AI bots" field (ai_bots_protection)
          # is coupled to it one way: writing it "disabled" also reset
          # ai_training to "disabled" (run 38992445763), while setting
          # ai_training back to "disallow" left it "disabled" (38992547397).
          # So it is never written here, and not compared below.
          WANT='{"enable_js":false,"ai_training":"disallow"}'
          BODY=$(jq -c --argjson w "$WANT" '. as $b | $w | with_entries(select($b[.key] != .value))' <<<"$BEFORE")
          if [ "$BODY" = "{}" ]; then
            echo "Already as wanted: $WANT"
            AFTER=$BEFORE
          else
            [ "$(call PUT "$BM" "$BODY")" = 200 ] \
              || fail "setting $BODY failed — the token needs Zone → Bot Management: Edit"
            [ "$(call GET "$BM")" = 200 ] || fail "re-reading $BM failed"
            AFTER=$(jq -c '.result' "$OUT")
            echo "After:  $AFTER"
            jq -e --argjson w "$WANT" '. as $a | $w | to_entries | all($a[.key] == .value)' <<<"$AFTER" >/dev/null \
              || fail "the PUT answered 200 but the settings are not $WANT"
            # The body names only those fields; anything else that moved (but
            # the legacy mirror) is a surprise to restore from the Before line.
            CHANGED=$(jq -nc --argjson a "$BEFORE" --argjson b "$AFTER" --argjson w "$WANT" \
              '[$a, $b | keys[]] | unique | map(select(. as $k | ($w | has($k) | not)
                and $k != "ai_bots_protection" and $a[$k] != $b[$k]))')
            if [ "$CHANGED" != "[]" ]; then
              echo "::error::the PUT also changed $CHANGED — restore them from the Before line"
              exit 1
            fi
            echo "Set $BODY; nothing else changed."
          fi
          # Read-only guards on what the dashboard owns: each of these would
          # block search engines or CI. Search "block" stops search crawlers;
          # Bot Fight Mode and content-bot blocking challenge GitHub's runners;
          # AI Labyrinth rewrites HTML after the Worker.
          BAD=$(jq -r '[(select(.fight_mode == true) | "fight_mode"),
            (select(.ai_search == "block") | "ai_search=block"),
            (select(.content_bots_protection == "block") | "content_bots_protection=block"),
            (select(.crawler_protection == "enabled") | "crawler_protection=enabled")] | join(", ")' <<<"$AFTER")
          [ -z "$BAD" ] || fail "bot settings that break search engines or CI: $BAD (docs/cloudflare-security.md)"

      - name: Zone settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          # stderr: get() runs inside $(…), which would swallow stdout.
          fail() { echo "::error::$1" >&2; jq -c '.errors' "$OUT" 1>&2 2>/dev/null || cat "$OUT" >&2; exit 1; }
          S="/zones/$ZONE_ID/settings"
          get() { # setting -> its JSON value
            [ "$(call GET "$S/$1")" = 200 ] || fail "reading $1 failed — the token needs Zone → Zone Settings: Edit"
            jq -c '.result.value' "$OUT"
          }
          set_to() { # setting json_value — write, then read back
            [ "$(call PATCH "$S/$1" "$(jq -nc --argjson v "$2" '{value: $v}')")" = 200 ] \
              || fail "setting $1 failed — the token needs Zone → Zone Settings: Edit"
            [ "$(get "$1")" = "$2" ] || fail "$1 answered 200 but does not read back as $2"
          }
          ensure() { # setting json_value
            local v; v=$(get "$1")
            if [ "$v" = "$2" ]; then echo "$1: $v (already)"; else set_to "$1" "$2"; echo "$1: $v → $2"; fi
          }

          # 0 = Respect Existing Headers: the edge stops rewriting max-age on
          # Cache API hits (withStoredTtl in src/http.ts undoes it; kept as a
          # backstop). Every response here already sets its own Cache-Control.
          ensure browser_cache_ttl 0
          # 0-RTT resumption: Cloudflare takes only GET/HEAD/OPTIONS in early
          # data, and every write here is a POST, so a replay changes nothing.
          ensure 0rtt '"on"'
          # Raise-only: 1.2 is the floor; a stricter 1.3 is the owner's choice
          # and is kept (measured 1.3 on 2026-10-16: TLS 1.2 was refused).
          v=$(get min_tls_version)
          case "$v" in
            '"1.2"'|'"1.3"') echo "min_tls_version: $v (kept)" ;;
            *) set_to min_tls_version '"1.2"'; echo "min_tls_version: $v → \"1.2\"" ;;
          esac

      - name: Scanner-block WAF rule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WAF_PHASE: http_request_firewall_custom
          WAF_REF: scanner_block
          WAF_EXPR_FILE: .github/waf/scanner-block.expr
        run: |
          set -euo pipefail
          OUT=$(mktemp)
          call() { # method path [json] -> HTTP status on stdout, body in $OUT
            curl -sS --max-time 30 -o "$OUT" -w '%{http_code}' -X "$1" "$CF_API$2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' ${3:+--data "$3"}
          }
          fail() { echo "::error::$1"; jq -c '.errors' "$OUT" 2>/dev/null || cat "$OUT"; exit 1; }
          # Whitespace folded to single spaces, here and when comparing what
          # the API stores (no string literal in the expression has a space).
          NORM='gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ")'
          EXPR=$(jq -Rrs "$NORM" "$WAF_EXPR_FILE")
          [ "${#EXPR}" -le 4096 ] || fail "the expression is ${#EXPR} chars (limit 4096)"
          rule() { # [ref] -> the rule as JSON
            jq -nc --arg e "$EXPR" --arg ref "${1:-}" '{description: "Block scanners (.github/waf/scanner-block.expr)",
              expression: $e, action: "block", enabled: true} + (if $ref == "" then {} else {ref: $ref} end)'
          }

          EP="/zones/$ZONE_ID/rulesets/phases/$WAF_PHASE/entrypoint"
          code=$(call GET "$EP") || true
          if [ "$code" = 404 ]; then # no custom rules at all: nothing to replace
            [ "$(call PUT "$EP?dry_run=true" "$(jq -nc --argjson r "$(rule "$WAF_REF")" '{rules: [$r]}')")" = 200 ] \
              || fail "the dry run rejected the rule"
            [ "$(call PUT "$EP" "$(jq -nc --argjson r "$(rule "$WAF_REF")" '{rules: [$r]}')")" = 200 ] \
              || fail "creating the $WAF_PHASE ruleset failed"
            echo "Created the $WAF_PHASE ruleset with the rule."
            jq -c '.result.rules[] | {id, ref, description, action, enabled}' "$OUT"
            exit 0
          fi
          [ "$code" = 200 ] || fail "reading $WAF_PHASE failed (HTTP $code) — the token needs Zone → Zone WAF: Edit"
          RULESET_ID=$(jq -r '.result.id' "$OUT")
          BEFORE=$(jq -c '.result.rules // []' "$OUT")
          echo "Custom rules before:"
          jq -c '.[] | {id, ref, description, action, enabled, chars: (.expression | length)}' <<<"$BEFORE"

          # Ours by ref, else by our name. The first run adopts the dashboard
          # rule ("Security rules для rozsoshnykh.no") by the old 52-pattern
          # expression's signature — never a second rule next to it, which
          # would stay first and keep blocking slugs.
          pick='if length == 1 then .[0].id elif length == 0 then "" else "MANY" end'
          ID=$(jq -r --arg r "$WAF_REF" "[.[] | select(.ref == \$r)] | $pick" <<<"$BEFORE")
          [ -n "$ID" ] || ID=$(jq -r "[.[] | select(.action == \"block\" and
            ((.description // \"\") | ascii_downcase | startswith(\"block scanners\")))] | $pick" <<<"$BEFORE")
          [ -n "$ID" ] || ID=$(jq -r --arg sig 'http.request.uri.path contains ".php"' \
            "[.[] | select(.action == \"block\" and (.expression | contains(\$sig)))] | $pick" <<<"$BEFORE")
          [ "$ID" != MANY ] || fail "more than one candidate rule — merge them by hand, then re-run"

          if [ -n "$ID" ]; then
            OLD=$(jq -c --arg id "$ID" '.[] | select(.id == $id)' <<<"$BEFORE")
            if [ "$(jq -r ".expression | $NORM" <<<"$OLD")" = "$EXPR" ] \
                && jq -e '.action == "block" and .enabled' <<<"$OLD" >/dev/null; then
              echo "Rule $ID is already current."
              exit 0
            fi
            echo "Replacing rule $ID. Its current expression, for a rollback:"
            jq -r '.expression' <<<"$OLD"
            P="/zones/$ZONE_ID/rulesets/$RULESET_ID/rules/$ID"
            B=$(rule "$WAF_REF")
            # The dry run validates syntax, fields and plan entitlements and
            # saves nothing. Whether PATCH may set a ref on an existing rule
            # is undocumented: without it, the name finds the rule next time.
            if [ "$(call PATCH "$P?dry_run=true" "$B")" != 200 ]; then
              echo "Dry run with ref refused:"; jq -c '.errors' "$OUT"
              B=$(rule)
              [ "$(call PATCH "$P?dry_run=true" "$B")" = 200 ] || fail "the dry run rejected the rule"
            fi
            [ "$(call PATCH "$P" "$B")" = 200 ] || fail "PATCH of rule $ID failed"
          else
            [ "$(jq length <<<"$BEFORE")" -lt 5 ] || fail "all 5 custom rules are in use"
            P="/zones/$ZONE_ID/rulesets/$RULESET_ID/rules"
            B=$(rule "$WAF_REF")
            [ "$(call POST "$P?dry_run=true" "$B")" = 200 ] || fail "the dry run rejected the rule"
            [ "$(call POST "$P" "$B")" = 200 ] || fail "POST of the rule failed"
          fi
          AFTER=$(jq -c '.result.rules' "$OUT")
          OURS="(.id == \$id or (.expression | $NORM) == \$e)"
          jq -e --arg e "$EXPR" --arg id "$ID" \
            "[.[] | select($OURS and (.expression | $NORM) == \$e and .action == \"block\" and .enabled)] | length == 1" \
            <<<"$AFTER" >/dev/null || fail "the rule did not read back as sent"
          jq -en --argjson a "$BEFORE" --argjson b "$AFTER" --arg e "$EXPR" --arg id "$ID" \
            "def others(x): [x[] | select($OURS | not) | del(.version, .last_updated)]; others(\$a) == others(\$b)" \
            >/dev/null || fail "another custom rule changed — compare the before/after lists"
          echo "Custom rules after:"
          jq -c '.[] | {id, ref, description, action, enabled, chars: (.expression | length)}' <<<"$AFTER"

      - name: Check prod
        run: |
          set -u
          BASE="https://$ZONE"
          # A miss under an asset-first path: 404 + no-store (fresh URL per run,
          # retried while the rule propagates).
          MISS="$BASE/_next/static/chunks/zone-rules-probe-$GITHUB_RUN_ID.js"
          ok=
          for i in 1 2 3 4 5 6; do
            h=$(curl -sS -o /dev/null -D - --max-time 20 "$MISS" | tr -d '\r')
            if echo "$h" | grep -q '^HTTP/[0-9.]* 404' && echo "$h" | grep -qi '^cache-control: no-store$'; then ok=1; break; fi
            echo "  retry $i: $(echo "$h" | grep -i '^cache-control:' || echo 'no cache-control')"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$MISS is not 404 + no-store — the rule does not reach asset-server responses"; exit 1; }
          echo "OK   static miss: 404 + no-store"
          # A real chunk and its 304 keep the year-long immutable cache.
          C=$(curl -sS --max-time 20 "$BASE/" | grep -o '/_next/static/chunks/[^"]*\.js' | head -1)
          h=$(curl -sS -o /dev/null -D - --max-time 20 "$BASE$C" | tr -d '\r')
          echo "$h" | grep -qi '^cache-control: public, max-age=31536000, immutable$' \
            || { echo "::error::$C lost its immutable cache-control"; echo "$h"; exit 1; }
          etag=$(echo "$h" | grep -i '^etag:' | cut -d' ' -f2-)
          [ -n "$etag" ] || { echo "::error::$C has no etag — can't probe its 304"; echo "$h"; exit 1; }
          h=$(curl -sS -o /dev/null -D - --max-time 20 -H "If-None-Match: $etag" "$BASE$C" | tr -d '\r')
          echo "$h" | grep -q '^HTTP/[0-9.]* 304' \
            || { echo "::error::$C did not answer 304 to If-None-Match"; echo "$h"; exit 1; }
          if echo "$h" | grep -qi '^cache-control:.*no-store'; then
            echo "::error::the 304 for $C carries no-store"; echo "$h"; exit 1
          fi
          echo "OK   real chunk: immutable, 304 without no-store"
          # No edge-injected JavaScript Detections loader in the HTML (retried
          # while the setting propagates).
          ok=
          for i in $(seq 1 12); do
            h=$(curl -sS -o page.html -D - --max-time 20 "$BASE/" | tr -d '\r')
            if ! grep -q '/cdn-cgi/challenge-platform/' page.html; then ok=1; break; fi
            echo "  retry $i: the JSD loader is still injected"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::$BASE/ still carries the /cdn-cgi/challenge-platform/ loader"; exit 1; }
          echo "OK   no JSD loader in $BASE/ ($(echo "$h" | grep -i '^etag:' || echo 'no etag'))"
          # TLS 1.1 is refused by the edge (OpenSSL 3 needs SECLEVEL=0 even to
          # offer it; plain curl --tls-max 1.1 fails client-side and proves nothing).
          if echo | openssl s_client -connect "$ZONE:443" -servername "$ZONE" -tls1_1 -cipher 'DEFAULT:@SECLEVEL=0' 2>&1 \
              | grep -q 'alert protocol version'; then
            echo "OK   TLS 1.1 refused"
          else
            echo "::error::$ZONE accepted (or never answered) a TLS 1.1 handshake"; exit 1
          fi
          # AI training crawlers are blocked at the edge (Cloudflare's 403 page,
          # X-Frame-Options SAMEORIGIN — the Worker's say DENY).
          h=$(curl -sS -o /dev/null -D - --max-time 20 \
            -A 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; GPTBot/1.2; +https://openai.com/gptbot)' \
            "$BASE/" | tr -d '\r')
          if echo "$h" | grep -q '^HTTP/[0-9.]* 403' && echo "$h" | grep -qi '^x-frame-options: SAMEORIGIN'; then
            echo "OK   GPTBot gets Cloudflare's 403"
          else
            echo "::error::a GPTBot UA was not blocked at the edge"; echo "$h" | head -3; exit 1
          fi
          # Scanner-block rule: Cloudflare's 403 has X-Frame-Options SAMEORIGIN
          # and no CSP; everything the Worker serves has DENY and a CSP.
          probe() { curl -sS -o /dev/null -D - --max-time 20 --path-as-is "$BASE$1" | tr -d '\r'; }
          cf403() { echo "$1" | grep -q '^HTTP/[0-9.]* 403' && echo "$1" | grep -qi '^x-frame-options: SAMEORIGIN' \
            && ! echo "$1" | grep -qi '^content-security-policy:'; }
          worker() { echo "$1" | grep -Eq "^HTTP/[0-9.]* ($2)" && echo "$1" | grep -qi '^x-frame-options: DENY'; }
          # Only the new rule blocks upper case: wait for it to propagate.
          ok=
          for i in $(seq 1 12); do
            cf403 "$(probe /WP-LOGIN.PHP)" && { ok=1; break; }
            echo "  retry $i: /WP-LOGIN.PHP not blocked yet"
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::/WP-LOGIN.PHP is not blocked — the new rule is not live"; exit 1; }
          bad=0
          for p in /wp-login.php /.env /.git/config /blog/wp-includes/wlwmanifest.xml /phpmyadmin/ \
                   /vendor/phpunit/phpunit/src/Util/PHP/eval-stdin.php /actuator/env /web.config /config.json \
                   /backup.zip /index.php/api/index; do
            if cf403 "$(probe "$p")"; then echo "OK   CF 403      $p"; else echo "::error::$p is not blocked by Cloudflare"; bad=1; fi
          done
          # Slugs the old path-anywhere rule 403'd must reach the Worker now
          # (404 today; 200 once a post by that name exists — either is fine).
          for p in /blogg/jenkins-pipeline/ /blogg/tag/docker-compose/ /en/blog/solr-tuning/ /en/blog/tag/wp-cli/ \
                   /blogg/pmap-command/ /blogg/jenkins-pipeline/opengraph-image \
                   /blogg/jenkins-pipeline/__next.blogg.%24d%24slug.__PAGE__.txt; do
            if worker "$(probe "$p")" '200|404'; then echo "OK   Worker      $p"; else echo "::error::$p: expected the Worker's 200/404"; bad=1; fi
          done
          for p in / /blogg/ /blogg/velkommen/ /en/blog/welcome/ /.well-known/security.txt /favicon.ico /feed.xml \
                   /api/status /api/views/jenkins-pipeline; do
            if worker "$(probe "$p")" 200; then echo "OK   Worker 200  $p"; else echo "::error::$p: expected the Worker's 200"; bad=1; fi
          done
          exit $bad
