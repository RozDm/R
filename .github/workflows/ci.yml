name: CI

# deploy.yml already runs the same lint/typecheck/test/build gate on push to
# main, so we only need this workflow for PRs.
on:
  pull_request:
    branches: [main]

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret, not from GitHub.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          # Cloudflare's public always-pass TEST site key, so the export renders
          # the Turnstile widget as production does; e2e/fixtures.ts serves a
          # stand-in api.js — no test reaches Cloudflare. deploy.yml builds
          # with the real key.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      # The Worker bundle and wrangler.jsonc as `wrangler deploy` would upload
      # them — no credentials needed. Without it a bundling error surfaced only
      # in deploy.yml, after the merge.
      - run: npx wrangler deploy --dry-run
      # After the build: the UI dictionary must stay in one shared chunk
      # (next.config.mjs turbopackChunking — an experimental key a Next
      # upgrade can drop with only a warning).
      - run: npm run check:dict
      # Needs out/: the WAF expression must block no URL the build serves.
      - run: npm run check:waf
      # Every page's baked-in CSP covers each of its inline scripts.
      - run: npm run check:csp

      # For the browser tests. out/ has a dot-directory
      # (.well-known/security.txt), which upload-artifact skips unless told.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Browser tests on the built export (playwright.config.ts, e2e/): the user
  # flows, axe in both themes, no console error or CSP violation. In the
  # official Playwright image, which brings Chromium, WebKit and their system
  # packages — installing them on the bare runner took 3–37 min. Only the
  # tests run in it: the Next build there failed to load next/font/google.
  # The tag must equal @playwright/test's version (tests/workflows.test.ts),
  # the digest pins it like the actions' SHAs; uid 1001 is the runner's, so
  # the checkout stays writable.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out/

      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The one required status check on main (branch protection names `check`):
  # green only when both jobs above are. `always()` so a failed or skipped
  # job makes it red rather than skipped — a skipped required check passes.
  check:
    needs: [build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$E2E" = success
        env:
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
