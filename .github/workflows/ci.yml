name: CI

# deploy.yml already runs the same lint/typecheck/test/build gate on push to
# main, so we only need this workflow for PRs.
on:
  pull_request:
    branches: [main]

# Read-only GITHUB_TOKEN: nothing here writes to the repo; Cloudflare access
# comes from the CLOUDFLARE_API_TOKEN secret, not from GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The official Playwright image: Chromium and WebKit and their system
    # packages are preinstalled. On the bare runner `playwright install
    # --with-deps chromium webkit` took 3–37 min, at the mercy of apt mirrors.
    # The tag must equal @playwright/test's version (tests/workflows.test.ts),
    # the digest pins it like the actions' SHAs; uid 1001 is the runner's, so
    # the checkout stays writable.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # After the build: the UI dictionary must stay in one shared chunk
      # (next.config.mjs turbopackChunking — an experimental key a Next
      # upgrade can drop with only a warning).
      - run: npm run check:dict
      # Needs out/: the WAF expression must block no URL the build serves.
      - run: npm run check:waf
      # Every page's baked-in CSP covers each of its inline scripts.
      - run: npm run check:csp
      # Browser tests on the built export (playwright.config.ts, e2e/): the
      # user flows, axe in both themes, no console error or CSP violation.
      # The browsers come with the image (PLAYWRIGHT_BROWSERS_PATH).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
